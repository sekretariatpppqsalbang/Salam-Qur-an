<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="salamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C2A0" />
      <stop offset="100%" stop-color="#008970" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#008970" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background with safe zone padding -->
  <rect width="512" height="512" rx="112" fill="url(#salamGrad)" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="8 8" />
  
  <!-- Quran Book Shape -->
  <g transform="translate(128, 128)" filter="url(#shadow)">
    <!-- Book pages left -->
    <path d="M 128 70 C 80 50 20 60 10 65 L 10 190 C 25 185 80 175 128 195 Z" fill="#FFFFFF" />
    <!-- Book pages right -->
    <path d="M 128 70 C 176 50 236 60 246 65 L 246 190 C 231 185 176 175 128 195 Z" fill="#F8FAFC" />
    <!-- Book Stand / Rehal bottom -->
    <path d="M 40 195 L 128 150 L 216 195 L 230 220 L 170 200 L 128 225 L 86 200 L 26 220 Z" fill="#3F4E5A" opacity="0.9" />
    <!-- Star Emblem Center Top -->
    <circle cx="128" cy="40" r="14" fill="#FFD700" />
    <path d="M 128 28 L 132 37 L 141 38 L 134 44 L 136 53 L 128 48 L 120 53 L 122 44 L 115 38 L 124 37 Z" fill="#FFFFFF" />
    <!-- Page lines left -->
    <line x1="30" y1="95" x2="110" y2="100" stroke="#00C2A0" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7" />
    <line x1="30" y1="120" x2="110" y2="125" stroke="#00C2A0" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7" />
    <line x1="30" y1="145" x2="90" y2="150" stroke="#00C2A0" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7" />
    <!-- Page lines right -->
    <line x1="146" y1="100" x2="226" y2="95" stroke="#00C2A0" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7" />
    <line x1="146" y1="125" x2="226" y2="120" stroke="#00C2A0" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7" />
    <line x1="166" y1="150" x2="226" y2="145" stroke="#00C2A0" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7" />
  </g>
</svg>
